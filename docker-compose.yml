services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5433:5432" # 5433 on the host so it does not clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://booking:booking@db:5432/booking
      PORT: "4000"
      REMINDER_POLL_MS: "10000"
      SEED_DEMO_DATA: "true"
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

  # ---- Test stack: `docker compose run --rm test` ------------------------
  # A throwaway Postgres on tmpfs, so tests never touch the app's data.
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql://booking:booking@db-test:5432/booking_test
    depends_on:
      db-test:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npx vitest run"]

volumes:
  pgdata:
